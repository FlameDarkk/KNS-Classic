name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  package:
    name: Package Server (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            arch: amd64
          - rid: linux-arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python3 -m pip install --upgrade pip pyelftools

      - name: Build and verify portable server package (${{ matrix.rid }})
        run: |
          python3 browser/port/build.py
          python3 tools/build_studio.py
          python3 scripts/package-server.py --rid "${{ matrix.rid }}"
          python3 browser/browser_tools.py verify-package build/kns-server
          mv build/kns-server.tar.gz "build/kns-server-${{ matrix.rid }}.tar.gz"

      - name: Upload package tarball
        uses: actions/upload-artifact@v4
        with:
          name: kns-server-${{ matrix.rid }}
          path: build/kns-server-${{ matrix.rid }}.tar.gz
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download server tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: kns-server-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: release-assets
        run: |
          sha256sum kns-server-linux-x64.tar.gz kns-server-linux-arm64.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
              release-assets/kns-server-linux-x64.tar.gz \
              release-assets/kns-server-linux-arm64.tar.gz \
              release-assets/SHA256SUMS.txt
          else
            gh release create "$TAG" --repo "${{ github.repository }}" \
              --title "KNS-Classic $TAG" \
              --generate-notes \
              release-assets/kns-server-linux-x64.tar.gz \
              release-assets/kns-server-linux-arm64.tar.gz \
              release-assets/SHA256SUMS.txt
          fi

  docker-ghcr:
    name: Publish Multi-Arch Docker Image (GHCR)
    runs-on: ubuntu-latest
    needs: [package]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download server tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: kns-server-*
          path: tarballs
          merge-multiple: true

      - name: Stage multi-arch Docker context
        run: |
          mkdir -p docker-ctx/amd64 docker-ctx/arm64
          tar -xzf tarballs/kns-server-linux-x64.tar.gz --strip-components=1 -C docker-ctx/amd64
          tar -xzf tarballs/kns-server-linux-arm64.tar.gz --strip-components=1 -C docker-ctx/arm64
          python3 -c '
          from pathlib import Path
          df = Path("deploy/Dockerfile").read_text(encoding="utf-8")
          df = df.replace("COPY server /opt/kns/server", "ARG TARGETARCH\nCOPY ${TARGETARCH}/server /opt/kns/server", 1)
          df = df.replace("COPY web /opt/kns/web", "COPY ${TARGETARCH}/web /opt/kns/web", 1)
          Path("docker-ctx/Dockerfile").write_text(df, encoding="utf-8", newline="\n")
          '
          cat docker-ctx/Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.licenses=AGPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
