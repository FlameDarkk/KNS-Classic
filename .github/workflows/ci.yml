name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  server-tests:
    name: .NET 8 Server Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test server-dotnet
        run: dotnet test server-dotnet/KnS.Server.sln --configuration Release --verbosity normal

  browser-and-tools:
    name: Engine, Browser, Studio & Tools Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python3 -m pip install --upgrade pip pyelftools

      - name: Run apk-cpu-engine tests
        run: node --test "apk-cpu-engine/tests/*.test.cjs"

      - name: Build browser game and Admin Studio
        run: |
          python3 browser/port/build.py
          python3 tools/build_studio.py
          python3 browser/browser_tools.py inspect
          python3 browser/browser_tools.py verify-effects

      - name: Run browser port & headless ELF tests
        run: node --test "browser/port/tests/*.test.cjs"

      - name: Run tools regression tests
        run: python3 -m unittest discover -s tools/tests -v

      - name: Lint shell scripts
        run: shellcheck deploy/install.sh

  package-and-docker:
    name: Server Package & Docker Smoke Test
    runs-on: ubuntu-latest
    needs: [server-tests, browser-and-tools]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python3 -m pip install --upgrade pip pyelftools

      - name: Build and verify portable Linux x64 server package
        run: |
          python3 browser/port/build.py
          python3 tools/build_studio.py
          python3 scripts/package-server.py --rid linux-x64
          python3 browser/browser_tools.py verify-package build/kns-server

      - name: Build Docker image and verify runtime + HEALTHCHECK
        run: |
          docker build -f build/kns-server/deploy/Dockerfile -t kns-classic:ci build/kns-server
          ADMIN_KEY=$(python3 -c "import secrets; print(secrets.token_hex(32))")
          docker run -d --name kns-ci \
            -p 127.0.0.1:8092:8092 \
            -e "KNS_ADMIN_KEY=$ADMIN_KEY" \
            --health-interval=2s \
            --health-retries=10 \
            kns-classic:ci

          cleanup() {
            docker logs kns-ci || true
            docker rm -f kns-ci || true
          }
          trap cleanup EXIT

          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' kns-ci)
            if [ "$status" = "healthy" ]; then
              echo "Container reported healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Container failed to become healthy (last status: $status)" >&2
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:8092/health | grep -q '"status":"ok"'
          curl -fsS http://127.0.0.1:8092/ | grep -q 'KNS_ELF'
          curl -fsS http://127.0.0.1:8092/studio | grep -q 'KNS_STUDIO_ASSETS'
          unauth=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8092/api/admin/accounts)
          test "$unauth" -eq 401
          auth=$(curl -s -o /dev/null -w '%{http_code}' -H "X-Admin-Key: $ADMIN_KEY" http://127.0.0.1:8092/api/admin/accounts)
          test "$auth" -eq 200

  detect-android-changes:
    name: Detect Android Changes
    runs-on: ubuntu-latest
    outputs:
      run_android: ${{ steps.check.outputs.run_android }}
    steps:
      - name: Decide whether to run Android 32-bit APK build
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run_android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -Eq '^(android/|browser/port/|browser/kns_data/|tools/kns_tools/|\.github/workflows/ci\.yml)'; then
            echo "run_android=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_android=false" >> "$GITHUB_OUTPUT"
          fi

  android-apk:
    name: Android 32-bit Modern APK Build Check
    runs-on: ubuntu-latest
    needs: [detect-android-changes]
    if: needs.detect-android-changes.outputs.run_android == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python build dependencies
        run: python3 -m pip install --upgrade pip pyelftools

      - name: Build browser payload and Android Modern APK
        run: |
          python3 browser/port/build.py
          python3 android/build_android.py --variant modern
          ls -lh build/KnS-Android-Modern.apk
