# nginx in front of the KnS-Classic server, inside an existing server { } block that already has TLS.
# Set KNS_PUBLIC_BASE in kns.env to the same path (here /kns/), or use "location / { ... }" with KNS_PUBLIC_BASE=/.
# The path is forwarded unchanged: no rewrite, no trailing slash on proxy_pass.
location = /kns { return 308 /kns/; }
location /kns/ {
    proxy_pass http://127.0.0.1:8092;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # In-game chat uses WebSockets.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade_kns;
    proxy_read_timeout 1h;
}
# At http { } level (once):
