# Run from the package folder (build.bat server -> build/kns-server):
#   cp deploy/kns.env.example deploy/kns.env      # then set KNS_ADMIN_KEY (64 hex characters)
#   docker compose -f deploy/docker-compose.yml up -d --build
# The game is then at http://<this machine>:8092/. For HTTPS on your own domain, set KNS_DOMAIN in deploy/kns.env and add
# --profile https: Caddy gets the certificate and forwards to the game (ports 80 and 443 must reach this machine).
services:
  kns:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: kns.env
    environment:
      # Fixed inside the container; the file's install.sh paths do not apply here.
      KNS_BIND: 0.0.0.0
      KNS_PORT: "8092"
      KNS_WEB_ROOT: /opt/kns/web
      KNS_DB: /var/lib/kns/kns.sqlite
      KNS_LOG_DIR: /var/lib/kns/logs
      KNS_TRUSTED_PROXIES: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    ports:
      - "8092:8092"
    volumes:
      - kns-data:/var/lib/kns

  caddy:
    profiles: ["https"]
    image: caddy:2.8
    restart: unless-stopped
    env_file: kns.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - kns

volumes:
  kns-data:
  caddy-data:
